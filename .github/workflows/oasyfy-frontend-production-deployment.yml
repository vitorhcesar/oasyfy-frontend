name: Oasyfy Frontend Production Deployment

on:
  push:
    tags:
      - "*"

concurrency:
  group: vps-deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/vitorhcesar/oasyfy-frontend
  REMOTE_APP_DIR: ~/oasyfy-frontend/oasyfy-frontend

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    environment: oasyfy-frontend-env
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          [ -n "${VPS_SSH_PRIVATE_KEY}" ] || { echo "::error::Missing required secret: VPS_SSH_PRIVATE_KEY"; exit 1; }
          [ -n "${VPS_HOST}" ] || { echo "::error::Missing required secret: VPS_HOST"; exit 1; }
          [ -n "${VPS_USER}" ] || { echo "::error::Missing required secret: VPS_USER"; exit 1; }
          [ -n "${PROD_ENV}" ] || { echo "::error::Missing required secret: PROD_ENV"; exit 1; }

          printf "%s" "${PROD_ENV}" > /tmp/prod.env
          grep -q "^VITE_API_URL=." /tmp/prod.env || { echo "::error::PROD_ENV must define VITE_API_URL (required at build time)"; exit 1; }
          grep -q "^VITE_SUPABASE_URL=." /tmp/prod.env || { echo "::error::PROD_ENV must define VITE_SUPABASE_URL (required at build time)"; exit 1; }
          grep -q "^VITE_SUPABASE_PUBLISHABLE_KEY=." /tmp/prod.env || { echo "::error::PROD_ENV must define VITE_SUPABASE_PUBLISHABLE_KEY (required at build time)"; exit 1; }

  build-and-push:
    runs-on: ubuntu-latest
    environment: oasyfy-frontend-env
    needs: validate-secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            prod_env=${{ secrets.PROD_ENV }}

  deploy:
    runs-on: ubuntu-latest
    environment: oasyfy-frontend-env
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare destination on VPS
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            mkdir -p ${REMOTE_APP_DIR}
          "

      - name: Sync deployment files to VPS
        shell: bash
        run: |
          rsync -az docker-compose.prod.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${REMOTE_APP_DIR}/"

      - name: Transfer image to VPS and restart container
        shell: bash
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          docker pull "${IMAGE_TAG}"

          docker save "${IMAGE_TAG}" | gzip | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "gunzip | sudo docker load"

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            flock /tmp/oasyfy-deploy.lock -c '
              cd ${REMOTE_APP_DIR} &&
              APP_VERSION=${{ github.ref_name }} sudo -E docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans &&
              sudo docker image prune -f
            '
          "
